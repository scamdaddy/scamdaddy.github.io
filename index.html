<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artem — @scamdaddy</title>
  <meta name="description" content="вайбкодер. мечтаю заработать много денег и исчезнуть, а пока — просто чиллю.">
  <meta name="theme-color" content="#05030a">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://scamdaddy.github.io/">

  <!-- Иконки сайта -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Превью ссылки в Telegram, VK, Discord и т.д. (Open Graph).
       Мессенджеры не запускают JavaScript, поэтому всё здесь — готовым текстом,
       а адрес картинки — полный, с https:// -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Artem — @scamdaddy">
  <meta property="og:url" content="https://scamdaddy.github.io/">
  <meta property="og:title" content="Artem — @scamdaddy">
  <meta property="og:description" content="вайбкодер. мечтаю заработать много денег и исчезнуть, а пока — просто чиллю. заходи — тут звёзды, глитч и терминал.">
  <meta property="og:image" content="https://scamdaddy.github.io/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Artem — вайбкодер. неоновая надпись на звёздном фоне">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:locale:alternate" content="en_US">

  <!-- То же для X (Twitter) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Artem — @scamdaddy">
  <meta name="twitter:description" content="вайбкодер. мечтаю заработать много денег и исчезнуть, а пока — просто чиллю.">
  <meta name="twitter:image" content="https://scamdaddy.github.io/assets/og-image.png">

  <!-- Метка «JavaScript работает»: только тогда прячем блоки до появления при прокрутке.
       crt-boot — CRT-включение и звёзды-«ARTEM»: один раз за сессию и только если анимации не выключены.
       Ставим это здесь, в <head>, чтобы страница не успела мелькнуть до начала эффекта -->
  <script>
    document.documentElement.classList.add('js');
    try {
      if (!sessionStorage.getItem('booted') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('crt-boot');
      }
    } catch (e) {}
  </script>

  <!-- Шрифты: Orbitron для заголовков (латиница), Unbounded подхватывает кириллицу,
       JetBrains Mono для основного текста -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&family=Unbounded:wght@500;700;900&display=swap">

  <!-- Сезонные режимы (Хэллоуин, Новый год): подключаем в <head>, чтобы цвета сменились сразу -->
  <script src="js/season.js?v=20261017-1634"></script>

  <link rel="stylesheet" href="css/style.css?v=20261017-1634">
</head>
<body>
  <!-- CRT-включение: чёрные шторки разъезжаются от светящейся линии (js/fx.js, css) -->
  <div class="crt" id="crt" aria-hidden="true">
    <div class="crt__top"></div>
    <div class="crt__bottom"></div>
    <div class="crt__beam"></div>
    <div class="crt__scan"></div>
  </div>

  <!-- Звёздное небо рисуется на этом canvas (js/stars.js) -->
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="topbar">
    <!-- Неоновая полоса: сколько страницы пролистано -->
    <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
    <a class="topbar__logo" href="#hero">@scamdaddy<span class="topbar__cursor">_</span></a>

    <!-- Переключатель языка: выбор запоминается (js/main.js) -->
    <div class="lang-switch" role="group" aria-label="язык" data-i18n-label="lang.label">
      <button class="lang-switch__btn is-active" type="button" data-lang="ru" lang="ru" aria-pressed="true">ru</button>
      <button class="lang-switch__btn" type="button" data-lang="en" lang="en" aria-pressed="false">en</button>
    </div>
  </header>

  <main>
    <!-- Приветствие -->
    <section class="hero" id="hero">
      <!-- Пиксельный аватар: картинку собирает js/main.js из карты пикселей.
           Клик — случайная фраза -->
      <button class="avatar reveal" id="avatar" type="button" data-i18n-label="avatar.label" aria-label="пиксельный аватар Artem в тёмных очках">
        <span class="avatar__frame" aria-hidden="true"></span>
        <span class="avatar__inner" id="avatar-pixels" aria-hidden="true"></span>
      </button>
      <p class="hero__prompt reveal"><span class="accent-cyan">~/artem</span> $ whoami</p>
      <!-- Глитч: копии текста из data-text сдвигаются в розовом и голубом цвете -->
      <h1 class="hero__name glitch reveal" data-text="Artem">Artem</h1>
      <!-- Приветствие печатается само (js/effects.js), тексты — в js/i18n.js -->
      <div class="hero__greeting reveal" id="greeting"></div>
      <a class="hero__scroll reveal" href="#projects" data-i18n="hero.scroll">листай вниз ↓</a>
    </section>

    <!-- Проекты: карточки создаются из js/projects.js -->
    <section class="section" id="projects">
      <h2 class="section__title reveal"><span class="section__hash">//</span> <span data-i18n="projects.title">проекты</span></h2>
      <div class="cards" id="project-list"></div>
    </section>

    <!-- Обо мне -->
    <section class="section" id="about">
      <h2 class="section__title reveal"><span class="section__hash">//</span> <span data-i18n="about.title">обо мне</span></h2>
      <div id="about-list"></div>
    </section>

    <!-- Мини-терминал (js/terminal.js). По клавише ~ всплывает поверх страницы -->
    <section class="section" id="terminal-section">
      <h2 class="section__title reveal"><span class="section__hash">//</span> <span data-i18n="term.section">терминал</span></h2>
      <p class="section__hint reveal" data-i18n="term.hint" data-i18n-touch="term.hintTouch">пиши команды прямо здесь или нажми ~ в любом месте страницы</p>

      <div class="terminal reveal" id="terminal">
        <div class="terminal__bar">
          <span class="terminal__dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="terminal__title">guest@artem: ~</span>
          <button class="terminal__close" id="terminal-close" type="button" data-i18n-label="term.close" aria-label="закрыть терминал">esc</button>
        </div>
        <div class="terminal__output" id="terminal-output" role="log" aria-live="polite"></div>
        <form class="terminal__line" id="terminal-form">
          <label class="terminal__prompt" for="terminal-input">guest@artem:~$</label>
          <input class="terminal__input" id="terminal-input" type="text"
                 autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                 enterkeyhint="send" data-i18n-placeholder="term.placeholder" placeholder="введи help">
        </form>
      </div>
    </section>

    <!-- Место под анонимные сообщения — отдельный этап, пока скрыто -->
    <section class="section" id="anon-messages" hidden></section>
  </main>

  <footer class="footer" id="links">
    <!-- Иконки GitHub и Telegram (данные — в js/projects.js) -->
    <nav class="footer__links reveal" id="social-links" aria-label="ссылки" data-i18n-label="links.title"></nav>

    <!-- Место под счётчик просмотров — отдельный этап -->
    <div class="footer__views" id="views-counter" hidden></div>

    <p class="footer__credit reveal" data-i18n="footer.credit">сделано Artem вместе с Claude ❤️</p>
  </footer>

  <!-- Кнопка терминала (удобно на телефоне, где нет клавиши ~) -->
  <button class="terminal-fab" id="terminal-fab" type="button" data-i18n-label="term.open" aria-label="открыть терминал">&gt;_</button>

  <!-- Затемнение под всплывшим терминалом -->
  <div class="terminal-backdrop" id="terminal-backdrop"></div>

  <!-- Порядок важен: сначала данные, потом код, который их использует.
       ?v=… — версия: при каждом обновлении сайта меняем её (tools/bump-version.ps1),
       чтобы браузер не взял старые файлы из кэша -->
  <script src="js/stars.js?v=20261017-1634"></script>
  <script src="js/i18n.js?v=20261017-1634"></script>
  <script src="js/projects.js?v=20261017-1634"></script>
  <script src="js/effects.js?v=20261017-1634"></script>
  <script src="js/terminal.js?v=20261017-1634"></script>
  <script src="js/fx.js?v=20261017-1634"></script>
  <script src="js/main.js?v=20261017-1634"></script>
</body>
</html>
